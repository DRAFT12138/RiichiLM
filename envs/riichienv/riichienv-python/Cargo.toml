[package]
name = "riichienv-python"
version = "0.4.10"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "_riichienv"
crate-type = ["cdylib"]

[dependencies]
riichienv-core = { path = "../riichienv-core", default-features = false, features = ["python"] }
pyo3 = { version = "0.29.2" }
serde_json = "1.0"

[features]
default = []
source-adapters = ["riichienv-core/source-adapters"]
